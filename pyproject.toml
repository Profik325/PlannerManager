[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Dayfall Planner"
version = "1.0.0"
dependencies = [
    "flask>=3.1.0",
    "flask-login>=0.6.3",
    "sqlalchemy>=2.0.40",
    "flask-sqlalchemy>=3.0.0",
    "werkzeug>=3.1.3"]

[project.urls]
Homepage = "https://github.com/Profik325/PlannerManager"
Repository = "https://github.com/Profik325/PlannerManager.git"